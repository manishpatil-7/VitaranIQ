demand_model:
  phi: 0.10  # Gamma-Poisson dispersion (variance = mu + 0.10 * mu^2)
  weekday_multipliers:
    0: 0.90  # Mon
    1: 0.90  # Tue
    2: 0.95  # Wed
    3: 1.00  # Thu
    4: 1.10  # Fri
    5: 1.25  # Sat
    6: 1.20  # Sun
  seasonality:
    juice_amplitude: 0.25
    general_amplitude: 0.05
    peak_doy_offset: 15
  festival:
    major_skus: ["OIL-1L", "ATTA-5KG", "BISC-250", "CHIPS-90G", "TEA-250G", "JUICE-1L"]
    major_multiplier: 1.50
    general_multiplier: 1.20
  promo:
    multiplier: 1.35
    post_promo_multiplier: 0.85
    duration_days: 5
    post_promo_days: 3
    windows_per_quarter: 2
  trend:
    annual_growth: 0.10  # 1 + 0.10 * d / 730

forecasting:
  window_days: 9
  quantiles: [0.5, 0.7, 0.8, 0.9]
  service_level_floor: 0.7
  train_origins: [29, 620]
  val_origins: [630, 663]
  test_origins: [673, 721]

optimization:
  solver_time_limit_s: 8.0
  relative_gap_limit: 0.005
  objective_scale_k: 100  # 0.01 paise precision
  holding_cost_rate: 0.018  # 0.2% per day over 9 days
  fefo_epsilon_tie_break: 1
  default_workers: 4
  deterministic_workers: 1

simulation:
  start_day: 703
  end_day: 730
  plan_days: [703, 710, 717, 724]
  seeds: [11, 12, 13, 14, 15]
  scenarios:
    normal:
      inbound_factor: 1.05
    scarcity:
      inbound_factor: 0.80
